name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test (includes the §I.13 attribution recovery suite)
        run: pytest
      - name: Keyless demo (CI exit-code contract)
        run: retrieval-lab demo --out-dir "$RUNNER_TEMP/rlab-demo"

  ann:
    name: HNSW integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install with ANN support
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ann]"
      - name: Test real HNSW path
        run: pytest tests/test_ann.py
